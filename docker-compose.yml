services:
  backend:
    build: ./backend
    container_name: atv-ecosystem-backend
    environment:
      PYTHONUNBUFFERED: "1"
    env_file:
      - ./backend/.env
    ports:
      - "8004:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: atv-ecosystem-frontend
    ports:
      - "8084:80"
    depends_on:
      - backend
    restart: unless-stopped
